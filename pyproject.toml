[project]
name = "demand-forecast"
version = "0.1.0"
description = "Predicción de demanda de taxis por zona y hora"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    # pandas .to_markdown() needs this; the scoreboard is written in markdown.
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]